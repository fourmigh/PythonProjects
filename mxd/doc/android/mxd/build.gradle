plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.tristarinc.library.mxd'
    compileSdk = rootProject.ext.sdk_version

    defaultConfig {
        minSdk = 21
        targetSdk = rootProject.ext.sdk_version

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.compatibility_version
        targetCompatibility rootProject.ext.compatibility_version
    }
    kotlinOptions {
        jvmTarget = rootProject.ext.jvm_version
    }
}

dependencies {

    api project(':bit')
    api project(':kotlin')
    api project(':gson')
    api project(':converter')
    api project(':crc')
    api project(':mlog')
}