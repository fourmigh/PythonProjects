plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace = 'com.tristarinc.library.mxd.file.dkl'
    compileSdk = rootProject.ext.sdk_version

    defaultConfig {
        minSdk = 26
        targetSdk = rootProject.ext.sdk_version

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.compatibility_version
        targetCompatibility rootProject.ext.compatibility_version
    }
    kotlinOptions {
        jvmTarget = rootProject.ext.jvm_version
    }
}

dependencies {
    api project(':mxd_file')
    ksp "androidx.room:room-compiler:$room_version"
}