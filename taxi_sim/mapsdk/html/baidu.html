<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>html,body{margin:0;height:100%}#m{width:100%;height:100%}
.wr{text-align:center;font-family:sans-serif}
.mk{font-size:17px;line-height:18px}
.mk.dim{filter:grayscale(1);opacity:.55}
.bx{display:inline-block;background:rgba(255,255,255,.93);border:1px solid #8899aa;
border-radius:3px;padding:0 3px;font-size:9px;line-height:12px;color:#223344;white-space:nowrap}
.BMapLabel{border:none!important;background:transparent!important;padding:0!important}
</style></head>
<body><div id="m"></div>
<script src="https://api.map.baidu.com/api?type=webgl&v=1.0&ak=__KEY__"></script>
<script>
var map = new BMapGL.Map('m', {enableMapClick:false});
map.centerAndZoom(new BMapGL.Point(__LNG__, __LAT__), __ZOOM__);
map.enableScrollWheelZoom();
var taxiMk = {}, paxMk = {}, lines = {};
var ICON = {idle:'🚕', to_passenger:'🚖', onboard:'🚕', to_home:'🚖', off_duty:'🅿️'};
var PAX = {waiting:'🧍', pending:'💤', onboard:'🚕'};
var LABELS = {today:'今日收益', ride:'本单收益'};

function distKm(a,b,c,d){
  var dy=(a-c)*111.0, dx=(d-b)*111.0*Math.cos((a+c)/2*Math.PI/180);
  return Math.sqrt(dy*dy+dx*dx);
}
function arrow(a,b,c,d){
  var ang=Math.atan2(c-a,(d-b)*Math.cos((a+c)/2*Math.PI/180))*180/Math.PI;
  var i=Math.round((((ang%360)+360)%360)/45)%8;
  return ['→','↗','↑','↖','←','↙','↓','↘'][i];
}
function paxContent(p){
  var ico='<div class="mk'+(p.state==='pending'?' dim':'')+'">'+
          (PAX[p.state]||PAX.waiting)+'</div>';
  if(p.state==='pending'||!p.dest) return '<div class="wr">'+ico+'</div>';
  var txt=arrow(p.lat,p.lng,p.dest[0],p.dest[1])+' '+
          distKm(p.lat,p.lng,p.dest[0],p.dest[1]).toFixed(1)+'km';
  return '<div class="wr">'+ico+'<div class="bx">'+txt+'</div></div>';
}
function taxiContent(t){
  var ico='<div class="mk'+((t.state==='to_home'||t.state==='off_duty')?' dim':'')+'">'+
          (ICON[t.state]||'🚕')+'</div>';
  var rows=[LABELS.today+' ¥'+Number(t.income||0).toFixed(1)];
  if(t.ride>0) rows.push(LABELS.ride+' ¥'+Number(t.ride).toFixed(1));
  return '<div class="wr"><div class="bx">'+rows.join('<br>')+'</div>'+ico+'</div>';
}
function makeLabel(html, pt, offsetX, offsetY){
  var l = new BMapGL.Label(html, {position:pt,
      offset:new BMapGL.Size(offsetX, offsetY)});
  l.setStyle({border:'none', background:'transparent', padding:'0'});
  map.addOverlay(l);
  return l;
}
window.updateState = function(s){
  if(s.labels) LABELS=s.labels;
  var seenP={}, seenT={};
  (s.passengers||[]).forEach(function(p){ seenP[p.id]=1;
    var c = paxContent(p);
    if(paxMk[p.id]){
      paxMk[p.id].setPosition(new BMapGL.Point(p.lng,p.lat));
      if(paxMk[p.id]._c!==c){ paxMk[p.id].setContent(c); paxMk[p.id]._c=c; }
    } else { var m = makeLabel(c, new BMapGL.Point(p.lng,p.lat), -45, -12);
             m._c=c; paxMk[p.id]=m; }
  });
  Object.keys(paxMk).forEach(function(k){ if(!seenP[k]){ map.removeOverlay(paxMk[k]); delete paxMk[k]; }});
  (s.taxis||[]).forEach(function(t){ seenT[t.id]=1;
    var c = taxiContent(t);
    if(taxiMk[t.id]){
      taxiMk[t.id].setPosition(new BMapGL.Point(t.lng,t.lat));
      if(taxiMk[t.id]._c!==c){ taxiMk[t.id].setContent(c); taxiMk[t.id]._c=c; }
    } else { var m = makeLabel(c, new BMapGL.Point(t.lng,t.lat), -45, -32);
             m._c=c; taxiMk[t.id]=m; }
  });
  Object.keys(taxiMk).forEach(function(k){ if(!seenT[k]){ map.removeOverlay(taxiMk[k]); delete taxiMk[k]; }});
  Object.keys(lines).forEach(function(k){
    if(!(s.routes && s.routes[k])){ map.removeOverlay(lines[k]); delete lines[k]; }});
  if(s.routes) Object.keys(s.routes).forEach(function(k){
    var pts = s.routes[k].map(function(p){ return new BMapGL.Point(p[1], p[0]); });
    if(lines[k]) lines[k].setPath(pts);
    else lines[k] = new BMapGL.Polyline(pts, {strokeColor:'#2196f3', strokeWeight:5, strokeOpacity:0.9});
  });
};
window.setCenter = function(lat, lng){ map.setCenter(new BMapGL.Point(lng, lat)); };
</script></body></html>
